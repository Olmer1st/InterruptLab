# Source-checkout consumer example; package is not published yet.
name: cancellation-regressions
on: [pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/runtime/cli.js run scenarios/invoice-fixed.json --fail-on-inconclusive --format terminal,json,junit --out .interruptlab/ci
